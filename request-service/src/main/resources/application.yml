server:
  port: 8084

spring:
  application:
    name: request-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:request_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:secure_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:eW91cl9zdXBlcl9zZWNyZXRfa2V5X3RoYXRfc2hvdWxkX2JlX2F0X2xlYXN0XzI1Nl9iaXRzX2xvbmc=}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}

# Processing Configuration
request:
  processing:
    delay-seconds: ${PROCESSING_DELAY:10}

# Sender Service Configuration
sender-service:
  url: ${SENDER_SERVICE_URL:http://localhost:8083}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    root: INFO
    com.microservices.request: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
