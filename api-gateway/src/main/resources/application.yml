server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:eW91cl9zdXBlcl9zZWNyZXRfa2V5X3RoYXRfc2hvdWxkX2JlX2F0X2xlYXN0XzI1Nl9iaXRzX2xvbmc=}

# Services URLs
services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}
  sender-service:
    url: ${SENDER_SERVICE_URL:http://localhost:8083}
  request-service:
    url: ${REQUEST_SERVICE_URL:http://localhost:8084}

# Rate Limiting Configuration
rate-limit:
  requests-per-minute: ${RATE_LIMIT:60}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.microservices.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /auth-service/v3/api-docs
      - name: user-service
        url: /user-service/v3/api-docs
      - name: sender-service
        url: /sender-service/v3/api-docs
      - name: request-service
        url: /request-service/v3/api-docs
    use-root-path: true
